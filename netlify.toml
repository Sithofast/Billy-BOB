# Netlify settings for deploying straight from GitHub.
# The website lives in site/ (plain HTML/CSS/JS, no build step) and the
# serverless functions (support form → Discord, forum, Discord login) live in
# netlify/functions/.
[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  # Bundle each function together with the shared code it imports from netlify/lib/
  node_bundler = "esbuild"
